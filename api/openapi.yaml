openapi: 3.0.3
info:
  title: Nexo API
  version: 0.1.0
  description: |
    API de Nexo. Este contrato es la fuente de verdad: el servidor Go (oapi-codegen)
    y el cliente del frontend (orval) se generan a partir de él.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
# Every operation requires a Firebase ID token unless it declares `security: []`.
security:
  - bearerAuth: []
tags:
  - name: system
    description: Estado del servicio
  - name: users
    description: Usuarios y sesión
  - name: workspaces
    description: Espacios de trabajo y sus miembros
  - name: invitations
    description: Invitaciones para unirse a un espacio de trabajo
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Estado del servicio y de sus dependencias
      security: []
      responses:
        "200":
          description: El servicio y sus dependencias funcionan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      tags: [users]
      summary: Usuario autenticado
      description: |
        Devuelve el perfil del usuario que hace la petición. La primera petición
        autenticada de una cuenta crea su usuario en Nexo.
      responses:
        "200":
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: Espacios de trabajo del usuario
      description: Todos los espacios a los que pertenece el usuario autenticado, ordenados por nombre, con su rol en cada uno.
      responses:
        "200":
          description: Espacios de trabajo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Crear un espacio de trabajo
      description: Quien lo crea pasa a ser su primer administrador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "201":
          description: Espacio creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspace
      tags: [workspaces]
      summary: Un espacio de trabajo
      responses:
        "200":
          description: Espacio de trabajo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateWorkspace
      tags: [workspaces]
      summary: Renombrar un espacio de trabajo
      description: Solo administradores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "200":
          description: Espacio actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listMembers
      tags: [workspaces]
      summary: Miembros de un espacio de trabajo
      responses:
        "200":
          description: Miembros, por orden de incorporación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateMember
      tags: [workspaces]
      summary: Cambiar el rol de un miembro
      description: Solo administradores. Un espacio siempre conserva al menos un administrador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Miembro actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeMember
      tags: [workspaces]
      summary: Quitar un miembro o abandonar el espacio
      description: Los administradores pueden quitar a cualquiera; cualquier miembro puede quitarse a sí mismo. Un espacio siempre conserva al menos un administrador.
      responses:
        "204":
          description: Miembro quitado
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /workspaces/{workspaceId}/invitations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: Invitaciones pendientes
      description: Invitaciones por email sin aceptar y enlaces activos, sin caducar ni revocar. Solo administradores.
      responses:
        "200":
          description: Invitaciones pendientes, las más recientes primero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Invitar a alguien
      description: |
        Solo administradores.
        - `email`: envía un correo con el enlace de un solo uso (caduca en 7 días). Volver a invitar al mismo email revoca la invitación anterior.
        - `link`: devuelve un enlace reutilizable (caduca en 30 días) que **solo se muestra esta vez**. No puede dar el rol `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Invitación creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreated"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /workspaces/{workspaceId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeInvitation
      tags: [invitations]
      summary: Revocar una invitación
      description: Solo administradores. La invitación deja de poder aceptarse.
      responses:
        "204":
          description: Invitación revocada
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /invitations/{token}:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    get:
      operationId: getInvitation
      tags: [invitations]
      summary: Ver una invitación
      description: A qué espacio y con qué rol invita el enlace, para la pantalla de confirmación.
      responses:
        "200":
          description: Invitación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /invitations/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Aceptar una invitación
      description: |
        Une al usuario autenticado al espacio de trabajo. Las invitaciones por email
        exigen que el email de la cuenta coincida y esté verificado. Si el usuario ya
        es miembro, conserva su rol.
      responses:
        "200":
          description: Espacio de trabajo al que se ha unido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    InvitationToken:
      name: token
      in: path
      required: true
      description: El token del enlace de invitación. Nunca aparece en los logs.
      schema:
        type: string
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: El usuario debe ser miembro; si no lo es, la respuesta es 404.
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ID token de Firebase Authentication.
  responses:
    Problem:
      description: Error (RFC 9457 Problem Details)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status, version, checks]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: 0.1.0
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, fail]
          example:
            database: ok
    User:
      type: object
      required: [id, email, emailVerified, name, avatarUrl, isSuperadmin, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        name:
          type: string
        avatarUrl:
          type: string
        isSuperadmin:
          type: boolean
          description: Administrador de la plataforma (no de un espacio de trabajo).
        createdAt:
          type: string
          format: date-time
    Role:
      type: string
      enum: [admin, member, guest]
      description: |
        Rol en un espacio de trabajo. `admin` gestiona el espacio, sus miembros e
        invitaciones; `member` trabaja en él; `guest` es un colaborador externo
        (sus restricciones llegarán con los proyectos).
    WorkspaceInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Equipo de producto
    Workspace:
      type: object
      required: [id, name, myRole, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        myRole:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time
    WorkspaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
    Member:
      type: object
      required: [userId, email, name, avatarUrl, role, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          type: string
          format: date-time
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    MemberUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    InvitationKind:
      type: string
      enum: [email, link]
    InvitationInput:
      type: object
      required: [kind, role]
      properties:
        kind:
          $ref: "#/components/schemas/InvitationKind"
        email:
          type: string
          format: email
          description: Obligatorio cuando `kind` es `email`.
        role:
          $ref: "#/components/schemas/Role"
    Invitation:
      type: object
      required: [id, kind, role, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/InvitationKind"
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    InvitationCreated:
      type: object
      required: [invitation]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        url:
          type: string
          description: Solo en las invitaciones por enlace, y solo en esta respuesta.
    InvitationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
    InvitationPreview:
      type: object
      required: [workspaceName, kind, role, invitedBy, expiresAt, status]
      properties:
        workspaceName:
          type: string
        kind:
          $ref: "#/components/schemas/InvitationKind"
        email:
          type: string
          format: email
          description: A quién va dirigida (solo invitaciones por email).
        role:
          $ref: "#/components/schemas/Role"
        invitedBy:
          type: string
          description: Nombre de quien invita.
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, expired, revoked, accepted]
    Problem:
      type: object
      description: Error según RFC 9457. `code` es estable y legible por máquina; el frontend lo usa para traducir el mensaje.
      required: [title, status, code, traceId]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        code:
          type: string
          example: TASK_NOT_FOUND
        detail:
          type: string
          example: task 0192f7a4-… not found
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          example: title
        code:
          type: string
          example: REQUIRED
        message:
          type: string
