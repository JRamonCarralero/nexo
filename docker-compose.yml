# Local development services. Start with `make up`.
# The image must match backend/internal/platform/database/dbtest (integration tests).
services:
  postgres:
    image: postgres:17-alpine
    container_name: nexo-postgres
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
    ports:
      # 5433 on the host so it can coexist with a native PostgreSQL on 5432.
      - "${NEXO_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the API login role on a fresh volume (`make up` also applies it).
      - ./backend/db/local/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 2s
      timeout: 3s
      retries: 20

  firebase:
    build: ./docker/firebase
    image: nexo-firebase-emulator
    container_name: nexo-firebase
    ports:
      - "9099:9099" # Auth emulator
      - "4000:4000" # Emulator UI: http://localhost:4000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9099/ >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 60s

volumes:
  postgres-data:
