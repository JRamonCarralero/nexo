# Git hooks (installed by `make setup`). Fast checks only; CI runs the full suite.
pre-commit:
  parallel: true
  commands:
    go-fmt:
      root: backend/
      glob: "*.go"
      run: gofmt -l {staged_files} | (! grep .) || (echo "Run: make fmt" && exit 1)
    go-vet:
      root: backend/
      glob: "*.go"
      run: go vet ./...
    web-lint:
      root: frontend/
      glob: "*.{ts,tsx}"
      run: pnpm exec eslint {staged_files}
    web-format:
      root: frontend/
      glob: "*.{ts,tsx,json,css,md}"
      run: pnpm exec prettier --check {staged_files}

commit-msg:
  commands:
    conventional:
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' \
          || (echo "Commit message must follow Conventional Commits, e.g. 'feat(tasks): add board view'" && exit 1)
