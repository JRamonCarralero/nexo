# Mocks for unit tests (testify). Generated by `make generate`; do not edit them.
# Add an interface here when a service needs to be tested in isolation.
all: false
dir: "{{.InterfaceDir}}/mocks"
filename: "{{.InterfaceName | snakecase}}.go"
pkgname: mocks
structname: "{{.InterfaceName}}"
template: testify
formatter: goimports
packages:
  github.com/JRamonCarralero/nexo/backend/internal/modules/user:
    interfaces:
      Repository: {}
