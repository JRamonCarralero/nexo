version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # @types/node must follow the Node major in .nvmrc, not the latest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /docker/firebase
    schedule:
      interval: monthly
    ignore:
      # The Node major follows .nvmrc (an LTS) and is bumped by hand in both
      # places at once. Minor and patch updates still come through.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
